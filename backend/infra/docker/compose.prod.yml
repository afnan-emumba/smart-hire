services:
  postgres:
    image: postgres:15-alpine
    container_name: smarthire-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.25
    container_name: smarthire-temporal-prod

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB: postgres12
      DB_PORT: 5432

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres

      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility

    ports:
      - "7233:7233"
      - "8233:8233"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "temporal:7233",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    container_name: smarthire-temporal-ui-prod
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
    container_name: smarthire-backend-prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      RESUME_UPLOAD_DIR: ${RESUME_UPLOAD_DIR}
      MAX_RESUME_SIZE_BYTES: ${MAX_RESUME_SIZE_BYTES}
      JD_UPLOAD_DIR: ${JD_UPLOAD_DIR}
      MAX_JD_SIZE_BYTES: ${MAX_JD_SIZE_BYTES}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_PORT}:8000"

volumes:
  postgres_data:
