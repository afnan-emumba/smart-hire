services:
  postgres:
    image: postgres:15-alpine
    container_name: smarthire-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.25
    container_name: smarthire-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"
      - "8233:8233"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "temporal:7233",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    container_name: smarthire-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_UI_PORT}:8080"

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: smarthire-nginx
    depends_on:
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "${NGINX_PORT}:80"

  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: smarthire-user-service
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${USER_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      RESUME_SERVICE_URL: http://resume-service:8004
      APPLICATION_SERVICE_URL: http://application-service:8005
      JOB_SERVICE_URL: http://job-service:8003
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
    volumes:
      - ./services/user/migrations/versions:/app/migrations/versions
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service-worker:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: smarthire-user-service-worker
    command: ["python", "-m", "app.temporal.worker"]
    depends_on:
      temporal:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${USER_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      RESUME_SERVICE_URL: http://resume-service:8004
      APPLICATION_SERVICE_URL: http://application-service:8005
      JOB_SERVICE_URL: http://job-service:8003
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
    restart: unless-stopped

  job-service:
    build:
      context: .
      dockerfile: services/job/Dockerfile
    container_name: smarthire-job-service
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${JOB_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      JD_UPLOAD_DIR: /data/job_descriptions
      MAX_JD_SIZE_BYTES: ${MAX_JD_SIZE_BYTES}
      RECRUITER_SERVICE_URL: http://user-service:8001
      APPLICATION_SERVICE_URL: http://application-service:8005
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
    volumes:
      - job_uploads:/data/job_descriptions
      - ./services/job/migrations/versions:/app/migrations/versions
    ports:
      - "8003:8003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8003/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  job-service-worker:
    build:
      context: .
      dockerfile: services/job/Dockerfile
    container_name: smarthire-job-service-worker
    command: ["python", "-m", "app.temporal.worker"]
    depends_on:
      temporal:
        condition: service_healthy
      job-service:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${JOB_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      JD_UPLOAD_DIR: /data/job_descriptions
      MAX_JD_SIZE_BYTES: ${MAX_JD_SIZE_BYTES}
      RECRUITER_SERVICE_URL: http://user-service:8001
      APPLICATION_SERVICE_URL: http://application-service:8005
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
    volumes:
      - job_uploads:/data/job_descriptions
    restart: unless-stopped

  resume-service:
    build:
      context: .
      dockerfile: services/resume/Dockerfile
    container_name: smarthire-resume-service
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${RESUME_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      RESUME_UPLOAD_DIR: /data/resumes
      MAX_RESUME_SIZE_BYTES: ${MAX_RESUME_SIZE_BYTES}
      CANDIDATE_SERVICE_URL: http://user-service:8001
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
    volumes:
      - resume_uploads:/data/resumes
      - ./services/resume/migrations/versions:/app/migrations/versions
    ports:
      - "8004:8004"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8004/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  resume-service-worker:
    build:
      context: .
      dockerfile: services/resume/Dockerfile
    container_name: smarthire-resume-service-worker
    command: ["python", "-m", "app.temporal.worker"]
    depends_on:
      temporal:
        condition: service_healthy
      resume-service:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${RESUME_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      RESUME_UPLOAD_DIR: /data/resumes
      MAX_RESUME_SIZE_BYTES: ${MAX_RESUME_SIZE_BYTES}
      CANDIDATE_SERVICE_URL: http://user-service:8001
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
    volumes:
      - resume_uploads:/data/resumes
    restart: unless-stopped

  application-service:
    build:
      context: .
      dockerfile: services/application/Dockerfile
    container_name: smarthire-application-service
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      job-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${APPLICATION_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      JOB_SERVICE_URL: http://job-service:8003
      CANDIDATE_SERVICE_URL: http://user-service:8001
      RESUME_SERVICE_URL: http://resume-service:8004
      MAX_APPLICATIONS_PER_CANDIDATE: ${MAX_APPLICATIONS_PER_CANDIDATE}
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
    volumes:
      - ./services/application/migrations/versions:/app/migrations/versions
    ports:
      - "8005:8005"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8005/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: smarthire-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      NOTIFICATION_FAILURE_RATE: ${NOTIFICATION_FAILURE_RATE:-0.0}
    volumes:
      - ./services/notification/migrations/versions:/app/migrations/versions
    ports:
      - "8006:8006"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8006/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service-worker:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: smarthire-notification-service-worker
    command: ["python", "-m", "app.temporal.worker"]
    depends_on:
      temporal:
        condition: service_healthy
      notification-service:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      NOTIFICATION_FAILURE_RATE: ${NOTIFICATION_FAILURE_RATE:-0.0}
    restart: unless-stopped

volumes:
  postgres_data:
  job_uploads:
  resume_uploads:
