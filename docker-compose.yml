services:
  postgres:
    image: postgres:15-alpine
    container_name: smarthire-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.25
    container_name: smarthire-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"
      - "8233:8233"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "temporal:7233",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    container_name: smarthire-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_UI_PORT}:8080"

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: smarthire-nginx
    depends_on:
      recruiter-service:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "${NGINX_PORT}:80"

  recruiter-service:
    build:
      context: ./services/recruiter
      dockerfile: Dockerfile
    container_name: smarthire-recruiter-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${RECRUITER_DATABASE_URL}
      PYTHONPATH: /shared
    volumes:
      - ./shared:/shared
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  candidate-service:
    build:
      context: ./services/candidate
      dockerfile: Dockerfile
    container_name: smarthire-candidate-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${CANDIDATE_DATABASE_URL}
      RESUME_SERVICE_URL: http://resume-service:8004
      APPLICATION_SERVICE_URL: http://application-service:8005
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
      PYTHONPATH: /shared
    volumes:
      - ./shared:/shared
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  job-service:
    build:
      context: ./services/job
      dockerfile: Dockerfile
    container_name: smarthire-job-service
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${JOB_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      JD_UPLOAD_DIR: /data/job_descriptions
      MAX_JD_SIZE_BYTES: ${MAX_JD_SIZE_BYTES}
      RECRUITER_SERVICE_URL: http://recruiter-service:8001
      APPLICATION_SERVICE_URL: http://application-service:8005
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
      PYTHONPATH: /shared
    volumes:
      - ./shared:/shared
      - job_uploads:/data/job_descriptions
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  job-service-worker:
    build:
      context: ./services/job
      dockerfile: Dockerfile
    container_name: smarthire-job-service-worker
    command: ["python", "-m", "app.temporal.worker"]
    depends_on:
      temporal:
        condition: service_healthy
      job-service:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${JOB_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      JD_UPLOAD_DIR: /data/job_descriptions
      MAX_JD_SIZE_BYTES: ${MAX_JD_SIZE_BYTES}
      RECRUITER_SERVICE_URL: http://recruiter-service:8001
      APPLICATION_SERVICE_URL: http://application-service:8005
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
      PYTHONPATH: /shared
    volumes:
      - ./shared:/shared
      - job_uploads:/data/job_descriptions
    restart: unless-stopped

  resume-service:
    build:
      context: ./services/resume
      dockerfile: Dockerfile
    container_name: smarthire-resume-service
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${RESUME_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      RESUME_UPLOAD_DIR: /data/resumes
      MAX_RESUME_SIZE_BYTES: ${MAX_RESUME_SIZE_BYTES}
      CANDIDATE_SERVICE_URL: http://candidate-service:8002
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
      PYTHONPATH: /shared
    volumes:
      - ./shared:/shared
      - resume_uploads:/data/resumes
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8004/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  resume-service-worker:
    build:
      context: ./services/resume
      dockerfile: Dockerfile
    container_name: smarthire-resume-service-worker
    command: ["python", "-m", "app.temporal.worker"]
    depends_on:
      temporal:
        condition: service_healthy
      resume-service:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${RESUME_DATABASE_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      RESUME_UPLOAD_DIR: /data/resumes
      MAX_RESUME_SIZE_BYTES: ${MAX_RESUME_SIZE_BYTES}
      CANDIDATE_SERVICE_URL: http://candidate-service:8002
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
      PYTHONPATH: /shared
    volumes:
      - ./shared:/shared
      - resume_uploads:/data/resumes
    restart: unless-stopped

  application-service:
    build:
      context: ./services/application
      dockerfile: Dockerfile
    container_name: smarthire-application-service
    depends_on:
      postgres:
        condition: service_healthy
      job-service:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${APPLICATION_DATABASE_URL}
      JOB_SERVICE_URL: http://job-service:8003
      CANDIDATE_SERVICE_URL: http://candidate-service:8002
      RESUME_SERVICE_URL: http://resume-service:8004
      MAX_APPLICATIONS_PER_CANDIDATE: ${MAX_APPLICATIONS_PER_CANDIDATE}
      HTTP_CLIENT_TIMEOUT_SECONDS: ${HTTP_CLIENT_TIMEOUT_SECONDS}
      PYTHONPATH: /shared
    volumes:
      - ./shared:/shared
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8005/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: smarthire-notification-service
    environment:
      APP_ENV: ${APP_ENV}
      PYTHONPATH: /shared
    volumes:
      - ./shared:/shared
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8006/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  job_uploads:
  resume_uploads:
