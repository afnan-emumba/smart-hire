worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=applications_zone:10m rate=20r/s;

    upstream recruiter_service {
        server recruiter-service:8001;
    }

    upstream candidate_service {
        server candidate-service:8002;
    }

    upstream job_service {
        server job-service:8003;
    }

    upstream resume_service {
        server resume-service:8004;
    }

    upstream application_service {
        server application-service:8005;
    }

    upstream notification_service {
        server notification-service:8006;
    }

    server {
        listen 80;

        # Allow PDF uploads (max JD/resume size is 10 MB + multipart overhead)
        client_max_body_size 15m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        location = /api/v1/recruiters {
            proxy_pass http://recruiter_service/recruiters;
        }

        location /api/v1/recruiters/ {
            proxy_pass http://recruiter_service/recruiters/;
        }

        location = /api/v1/candidates {
            proxy_pass http://candidate_service/candidates;
        }

        location /api/v1/candidates/ {
            proxy_pass http://candidate_service/candidates/;
        }

        location = /api/v1/jobs {
            proxy_pass http://job_service/jobs;
        }

        location /api/v1/jobs/ {
            proxy_pass http://job_service/jobs/;
        }

        location = /api/v1/resumes {
            proxy_pass http://resume_service/resumes;
        }

        location /api/v1/resumes/ {
            proxy_pass http://resume_service/resumes/;
        }

        location = /api/v1/applications {
            limit_req zone=applications_zone burst=40 nodelay;
            proxy_pass http://application_service/applications;
        }

        location /api/v1/applications/ {
            proxy_pass http://application_service/applications/;
        }

        location = /api/v1/notifications {
            proxy_pass http://notification_service/notifications;
        }

        location /api/v1/notifications/ {
            proxy_pass http://notification_service/notifications/;
        }

        # Gateway liveness check — nginx itself, independent of backend services.
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # Per-service deep health checks (each proxies to that service's own DB-checking /health).
        location = /api/v1/health/recruiter {
            proxy_pass http://recruiter_service/health;
        }

        location = /api/v1/health/candidate {
            proxy_pass http://candidate_service/health;
        }

        location = /api/v1/health/job {
            proxy_pass http://job_service/health;
        }

        location = /api/v1/health/resume {
            proxy_pass http://resume_service/health;
        }

        location = /api/v1/health/application {
            proxy_pass http://application_service/health;
        }

        location = /api/v1/health/notification {
            proxy_pass http://notification_service/health;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Route not found"}';
        }
    }
}
