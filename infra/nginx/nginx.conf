worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream recruiter_service {
        server recruiter-service:8001;
    }

    upstream candidate_service {
        server candidate-service:8002;
    }

    upstream job_service {
        server job-service:8003;
    }

    upstream resume_service {
        server resume-service:8004;
    }

    upstream application_service {
        server application-service:8005;
    }

    upstream notification_service {
        server notification-service:8006;
    }

    server {
        listen 80;

        # Allow PDF uploads (max JD/resume size is 10 MB + multipart overhead)
        client_max_body_size 15m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        location /api/v1/recruiters/ {
            proxy_pass http://recruiter_service;
        }

        location /api/v1/candidates/ {
            proxy_pass http://candidate_service;
        }

        location /api/v1/jobs/ {
            proxy_pass http://job_service;
        }

        location /api/v1/resumes/ {
            proxy_pass http://resume_service;
        }

        location /api/v1/applications/ {
            proxy_pass http://application_service;
        }

        location /api/v1/notifications/ {
            proxy_pass http://notification_service;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Route not found"}';
        }
    }
}
